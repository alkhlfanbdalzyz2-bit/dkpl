<style>
:root{
  --n950:#050C1E; --n900:#07122A; --n800:#0A1631; --n700:#0F2049; --n600:#162C5E; --n500:#22407F;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#EEF2FA; --muted:#94A3C3; --dim:#6B7A9C;
  --or:#F2924A; --or2:#E27B33; --orS:rgba(242,146,74,.14); --orG:rgba(242,146,74,.35);
  --r:20px; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--n900);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6}
body{min-height:100vh;min-height:100dvh;background:
  radial-gradient(900px 500px at 85% -10%,rgba(34,64,127,.55),transparent 60%),
  radial-gradient(600px 400px at -10% 110%,rgba(242,146,74,.07),transparent 60%),var(--n900);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + var(--safeT)) 16px calc(110px + var(--safeB))}
.hide{display:none!important}
.muted{color:var(--muted)} .dim{color:var(--dim)} .or{color:var(--or)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.card{background:linear-gradient(180deg,rgba(22,44,94,.55),rgba(15,32,73,.55));border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(6px)}
.mt{margin-top:14px} .mt2{margin-top:22px}
h1,h2,h3{margin:0;font-weight:700}
.h-sec{font-size:15px;color:var(--muted);font-weight:600;margin:22px 4px 10px;display:flex;align-items:center;justify-content:space-between}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:38px;height:38px;border-radius:12px;background:var(--n700);border:1px solid var(--line2);display:grid;place-items:center}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand small{font-size:11.5px;color:var(--muted);letter-spacing:.14em;direction:ltr;display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--orS);color:var(--or);font-weight:700;font-size:13.5px;border:1px solid rgba(242,146,74,.25)}

/* hero */
.hero{position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(242,146,74,.16),transparent 70%)}
.greet{font-size:20px;font-weight:700}
.date{font-size:13px;color:var(--muted)}
.ringbox{position:relative;width:118px;height:118px;flex:none}
.ringbox svg{transform:rotate(-90deg)}
.ringbox .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringbox .val b{font-size:28px;line-height:1}
.ringbox .val span{font-size:11.5px;color:var(--muted);display:block;margin-top:4px}
.ring-bg{stroke:rgba(255,255,255,.08)} .ring-fg{stroke:var(--or);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(5,12,30,.35);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)} .stat .v{font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--or2),var(--or));transition:width .6s ease}
.lvl{font-size:12.5px;color:var(--muted)}
.fajrline{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}

/* pillars grid */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pmini{background:rgba(15,32,73,.6);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;transition:transform .15s}
.pmini:active{transform:scale(.96)}
.pmini .L{width:30px;height:30px;margin:0 auto 6px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--orS);color:var(--or);direction:ltr;font-size:14px}
.pmini .t{font-size:11.5px;color:var(--muted);line-height:1.3;height:30px;overflow:hidden}
.pmini .p{font-weight:700;font-size:15px;margin:4px 0 6px}
.pmini .bar{height:5px}

/* pillar sections */
.psec{scroll-margin-top:16px}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.phead .L{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--or),var(--or2));color:#1b0f05;direction:ltr;box-shadow:0 6px 18px -6px var(--orG)}
.phead h3{font-size:16.5px}
.phead .sub{font-size:12px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.iconbtn:active{background:rgba(255,255,255,.1)}
.task{width:100%;display:flex;align-items:center;gap:12px;text-align:right;padding:12px 12px;border-radius:14px;background:rgba(5,12,30,.28);border:1px solid transparent;margin-top:8px;transition:background .2s,border-color .2s,transform .12s}
.task:active{transform:scale(.985)}
.task .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--n500);flex:none;display:grid;place-items:center;transition:all .2s}
.task .ck svg{opacity:0;transform:scale(.5);transition:all .2s}
.task.done{background:rgba(242,146,74,.08);border-color:rgba(242,146,74,.22)}
.task.done .ck{background:var(--or);border-color:var(--or)}
.task.done .ck svg{opacity:1;transform:scale(1)}
.task.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(242,146,74,.5)}
.task .tx{flex:1;font-size:15px;line-height:1.5}
.task .st{font-size:11.5px;color:var(--or);display:flex;align-items:center;gap:3px;flex:none;opacity:.9}
.locked .task{pointer-events:none}

/* water */
.water{padding:12px;border-radius:14px;background:rgba(5,12,30,.28);margin-top:8px;border:1px solid transparent}
.water.done{background:rgba(242,146,74,.08);border-color:rgba(242,146,74,.22)}
.cups{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cup{width:26px;height:32px;border-radius:4px 4px 9px 9px;border:2px solid var(--n500);position:relative;overflow:hidden}
.cup.f{border-color:var(--or)} .cup.f:after{content:"";position:absolute;inset:30% 0 0;background:linear-gradient(180deg,rgba(242,146,74,.6),var(--or))}
.wbtn{width:44px;height:44px;border-radius:14px;font-size:22px;font-weight:700;display:grid;place-items:center;background:var(--n600);border:1px solid var(--line2)}
.wbtn.plus{background:linear-gradient(145deg,var(--or),var(--or2));color:#1b0f05;border:0}
.wbtn:active{transform:scale(.94)}

/* side tasks */
.addrow{display:flex;gap:8px}
.inp{width:100%;background:rgba(5,12,30,.45);border:1px solid var(--line2);border-radius:13px;padding:11px 13px;outline:none;font-size:15px}
.inp:focus{border-color:var(--or)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--n600);border:1px solid var(--line2);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(145deg,var(--or),var(--or2));color:#1b0f05;border:0;box-shadow:0 10px 26px -10px var(--orG)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff9b8a;border-color:rgba(255,120,100,.3);background:rgba(255,100,80,.06)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.del{color:var(--dim);width:32px;height:32px;display:grid;place-items:center;border-radius:10px;flex:none}

/* motivation */
.motiv{display:flex;gap:12px;align-items:center;border-radius:var(--r);padding:16px;background:linear-gradient(135deg,rgba(242,146,74,.14),rgba(242,146,74,.04));border:1px solid rgba(242,146,74,.2)}
.motiv p{margin:0;font-size:15px;line-height:1.8}
.closed-banner{text-align:center;padding:18px}
.closed-banner .seal{width:56px;height:56px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--orS);border:1px solid rgba(242,146,74,.35)}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:30;padding:8px 14px calc(8px + var(--safeB));background:rgba(7,18,42,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--dim);padding:6px;border-radius:12px}
.nav button.on{color:var(--or);background:var(--orS)}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,8,20,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;inset:auto 0 0 0;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--n800);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:10px 18px calc(24px + var(--safeB));transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.show{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
.sheet h2{font-size:18px;margin-bottom:4px}
@media(min-width:620px){.sheet{max-width:560px;margin:0 auto;left:0;right:0}}
.erow{display:flex;align-items:center;gap:8px;margin-top:8px}
.erow .inp{padding:9px 11px;font-size:14.5px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--n500);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--or)} .sw.on:after{transform:translateX(-18px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.chip:active{background:var(--orS)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(5,12,30,.45);border-radius:13px;padding:4px;border:1px solid var(--line)}
.seg button{padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--n600);color:var(--text)}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 2px 6px}

/* history */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:7px;background:rgba(255,255,255,.05);display:block;position:relative}
.heat i.today{outline:2px solid var(--or);outline-offset:1px}
.hlist .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.hlist .it:last-child{border:0}
.mbars{display:flex;gap:4px;margin-top:6px}
.mbars span{flex:1}
.mbars .bar{height:4px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--orS);color:var(--or)}

/* toast */
.toast{position:fixed;z-index:60;left:50%;bottom:calc(96px + var(--safeB));transform:translate(-50%,20px);opacity:0;background:var(--n600);border:1px solid var(--line2);padding:10px 16px;border-radius:14px;font-size:14px;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 28px calc(32px + var(--safeB));
  background:radial-gradient(700px 500px at 50% 30%,#163066 0%,var(--n800) 55%,var(--n950) 100%);transition:opacity .7s ease,transform .7s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .emb{width:108px;height:108px;animation:spin 60s linear infinite;filter:drop-shadow(0 0 24px rgba(242,146,74,.35))}
@keyframes spin{to{transform:rotate(360deg)}}
#splash .fade{opacity:0;transform:translateY(12px);animation:rise .9s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
#splash h1{font-family:Amiri,serif;font-size:38px;margin-top:22px;line-height:1.3}
#splash .tag{color:var(--muted);font-size:14px;letter-spacing:.3em;direction:ltr;margin-top:4px}
#splash .ayah{font-family:Amiri,serif;font-size:20px;color:#F6C9A4;margin:26px 0 4px;line-height:1.9}
#splash .ref{font-size:12px;color:var(--dim)}
#splash .msg{color:var(--muted);font-size:15px;margin:18px auto 0;max-width:320px}
#splash .go{margin-top:30px;min-width:220px;padding:15px 26px;font-size:16.5px;border-radius:16px}
#splash .inp{max-width:280px;text-align:center;margin:22px auto 0}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.35;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.08}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

    <button data-nav="history"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>السجل</button>

  </div>
</nav>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hide">

<script>
(() => {
'use strict';
/* ================= Constants ================= */
const KEY = 'dkpl.state.v1';
const PILLARS = [
  {k:'D', name:'الروح والإيمان', en:'Deen', sub:'صلةٌ بالله تُنير اليوم'},
  {k:'K', name:'العلم والتطوير', en:'Knowledge', sub:'علمٌ ينفع وعقلٌ يتجدد'},
  {k:'P', name:'الإنتاج والبناء', en:'Production', sub:'مهارةٌ تُبنى وأثرٌ يبقى'},
  {k:'L', name:'العادات والصحة', en:'Life', sub:'جسدٌ سليم وصِلةٌ حيّة'}
];
const P_PATHS = {
  'الأمن السيبراني': ['ساعة لتعلم الأمن السيبراني (Linux / شبكات / TryHackMe)','حلّ غرفة في TryHackMe','مراجعة أوامر Linux'],
  'البرمجة': ['ساعة برمجة في مشروع عملي','حلّ مسألة برمجية','تعلّم مفهوم جديد وتطبيقه'],
  'التصميم': ['ساعة تصميم وتطبيق عملي','تحليل تصميم ملهم','إنجاز قطعة لمعرض الأعمال'],
  'صناعة المحتوى': ['إنتاج مقطع أو منشور هادف','كتابة نص لمحتوى قادم','مونتاج ٣٠ دقيقة'],
  'مشروع شخصي': ['ساعة عمل مركّز على المشروع','إنجاز مهمة مؤجلة','تخطيط خطوة الغد']
};
const MOTIV = [
  'مستمر بإذن الله؛ أنت تستطيع، نفع الله بك.',
  'ثق بالله وتوكّل عليه، وامضِ بخطى ثابتة.',
  'يسّر الله لك أمرك، وبارك في يومك.',
  'قليلٌ دائم خيرٌ من كثيرٍ منقطع.',
  'خطوةٌ اليوم، وأثرٌ غدًا، وأجرٌ لا ينقطع بإذن الله.',
  'الثبات طريق، والبركة رفيقة من صدق.',
  'جدّد نيّتك؛ فبالنيّة تصير العادةُ عبادة.',
  'استعن بالله ولا تعجز، فالبدايات الصغيرة تصنع الكبار.'
];
const uid = () => Math.random().toString(36).slice(2,9);

function defaults(){
  const t = (id,text,extra={}) => ({id,text,on:true,...extra});
  return {
    v:1,
    settings:{ name:'', fajrMode:'auto', manualFajr:'04:45', lat:29.3759, lng:47.9774, place:'الكويت', angle:18, offset:0, threshold:60, goalMl:2500, cupMl:250 },
    tasks:{
      D:[t('d1','صلاة الفجر في وقتها'),t('d2','ركعة الوتر'),t('d3','قراءة الورد'),t('d4','أذكار الصباح'),t('d5','أذكار المساء'),t('d6','صلاة نافلة واحدة على الأقل'),t('d7','سماع القرآن'),t('d8','نشر ريلز أو تلاوة في الحالة')],
      K:[t('k1','مراجعة الفقه من زاد المستقنع'),t('k2','قراءة من كتاب الداء والدواء'),t('k3','مشاهدة فيديو مفيد في يوتيوب'),t('k4','دراسة')],
      P:[t('p1','ساعة لتعلم الأمن السيبراني وتطوير المهارات العملية (Linux / شبكات / TryHackMe)')],
      L:[t('l1','شرب ٢٫٥ لتر من الماء',{type:'water'}),t('l2','الاتصال بقريب أو صديق والسؤال عنه')]
    },
    activeDay:null, days:{}, created:Date.now(), seenSplashName:false
  };
}

/* ================= Storage ================= */
let S;
function load(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : defaults(); }
  catch(e){ S = defaults(); }
  S = migrate(S);
}
function migrate(s){
  const d = defaults();
  s.settings = Object.assign({}, d.settings, s.settings||{});
  s.tasks = s.tasks || d.tasks;
  PILLARS.forEach(p => { if(!Array.isArray(s.tasks[p.k])) s.tasks[p.k] = d.tasks[p.k]; });
  s.days = s.days || {};
  return s;
}
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('تعذّر الحفظ: مساحة المتصفح ممتلئة'); } }, 120); }
function saveNow(){ clearTimeout(saveT); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if(document.hidden) saveNow(); else tick(true); });

/* ================= Helpers ================= */
const AR = '٠١٢٣٤٥٦٧٨٩';
const n = x => String(x).replace(/\d/g, d => AR[d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = x => String(x).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,i) => { const d = dateOf(k); d.setDate(d.getDate()+i); return keyOf(d); };
const $ = s => document.querySelector(s);
const vib = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
function fmtTime(min){ min = ((Math.round(min)%1440)+1440)%1440; let h = Math.floor(min/60), m = min%60; const ap = h < 12 ? 'ص' : 'م'; h = h%12 || 12; return n(`${h}:${pad(m)}`)+' '+ap; }
function hijri(d){ try{ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',{day:'numeric',month:'long',year:'numeric'}).format(d); }catch(e){ return ''; } }
function greg(d){ try{ return new Intl.DateTimeFormat('ar-u-nu-arab',{weekday:'long',day:'numeric',month:'long'}).format(d); }catch(e){ return keyOf(d); } }

/* ================= Fajr calculation =================
   Standard astronomical method (sun declination + equation of time).
   Angle 18° = Kuwait Awqaf / MWL, 18.5° = Umm al-Qura. */
const RAD = Math.PI/180;
const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a+b : a; };
function julian(y,m,d){ if(m<=2){y-=1;m+=12;} const A=Math.floor(y/100), B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){
  const D=jd-2451545, g=fix(357.529+0.98560028*D,360), q=fix(280.459+0.98564736*D,360);
  const L=fix(q+1.915*Math.sin(g*RAD)+0.02*Math.sin(2*g*RAD),360), e=23.439-0.00000036*D;
  const RA=Math.atan2(Math.cos(e*RAD)*Math.sin(L*RAD),Math.cos(L*RAD))/RAD/15;
  return { eqt:q/15-fix(RA,24), decl:Math.asin(Math.sin(e*RAD)*Math.sin(L*RAD))/RAD };
}
function calcFajrHours(y,m,d,lat,lng,tz,angle){
  const jd = julian(y,m,d) - lng/(15*24);
  let t = 5/24;
  for(let i=0;i<3;i++){
    const s = sunPos(jd+t), noon = fix(12 - s.eqt, 24);
    const cosT = (-Math.sin(angle*RAD) - Math.sin(s.decl*RAD)*Math.sin(lat*RAD)) / (Math.cos(s.decl*RAD)*Math.cos(lat*RAD));
    if(cosT < -1 || cosT > 1) return null; // polar edge case
    t = (noon - Math.acos(cosT)/RAD/15)/24;
  }
  return t*24 + tz - lng/15;
}
/** Fajr minute-of-day for a given calendar date */
function fajrMin(date){
  const st = S.settings;
  if(st.fajrMode === 'manual'){ const [h,m] = (st.manualFajr||'04:45').split(':').map(Number); return h*60+m; }
  const y=date.getFullYear(), mo=date.getMonth()+1, d=date.getDate();
  const tz = -new Date(y,mo-1,d,12).getTimezoneOffset()/60;
  const h = calcFajrHours(y,mo,d,+st.lat,+st.lng,tz,+st.angle);
  if(h == null || !isFinite(h)) return 4*60+30;
  return Math.round(h*60) + (+st.offset||0);
}
/** Day key = calendar date on which the current Fajr-to-Fajr day began */
function currentDayKey(now = new Date()){
  const today = keyOf(now), mins = now.getHours()*60 + now.getMinutes();
  return mins < fajrMin(now) ? addDays(today,-1) : today;
}
function nextFajrDate(now = new Date()){
  const k = currentDayKey(now), nk = addDays(k,1), d = dateOf(nk), m = fajrMin(d);
  d.setHours(0, m, 0, 0); return d;
}

/* ================= Day model ================= */
const newDay = () => ({done:{}, water:0, side:[], closed:false, snap:null});
const enabled = k => S.tasks[k].filter(t => t.on);
const cupsGoal = () => Math.max(1, Math.ceil(S.settings.goalMl / S.settings.cupMl));
function isDone(t, d){ return t.type === 'water' ? (d.water||0) >= cupsGoal() : !!d.done[t.id]; }
function compute(d){
  const per = {}; let done = 0, total = 0;
  PILLARS.forEach(p => { const ts = enabled(p.k); const c = ts.filter(t => isDone(t,d)).length; per[p.k] = [c, ts.length]; done += c; total += ts.length; });
  const pct = total ? Math.round(done/total*100) : 0;
  const sideDone = d.side.filter(x => x.done).length;
  let xp = done*10 + sideDone*5;
  if(d.closed){ if(pct >= S.settings.threshold) xp += 20; if(pct === 100) xp += 30; }
  return {per, done, total, pct, xp, side:[sideDone, d.side.length], closed:!!d.closed};
}
function stats(k){
  const d = S.days[k]; if(!d) return null;
  if(k !== S.activeDay && d.snap) return d.snap;
  return compute(d);
}
function finalize(k){
  const d = S.days[k]; if(!d) return;
  S.tasks.L.concat(S.tasks.D,S.tasks.K,S.tasks.P).forEach(t => { if(t.type==='water' && isDone(t,d)) d.done[t.id] = true; });
  d.snap = compute(d);
}
function rollover(){
  const cur = currentDayKey();
  if(S.activeDay === cur) return false;
  if(S.activeDay && S.days[S.activeDay]) finalize(S.activeDay);
  S.activeDay = cur;
  if(!S.days[cur]) S.days[cur] = newDay();
  save(); return true;
}
const today = () => S.days[S.activeDay];
const qualifies = k => { const s = stats(k); return !!s && s.total > 0 && s.pct >= S.settings.threshold; };
function streak(){ let k = S.activeDay, c = 0; if(qualifies(k)) c++; k = addDays(k,-1); while(qualifies(k)){ c++; k = addDays(k,-1); } return c; }
function bestStreak(){
  const keys = Object.keys(S.days).sort(); if(!keys.length) return 0;
  let best=0, cur=0, k=keys[0]; const end = S.activeDay;
  while(k <= end){ if(qualifies(k)){ cur++; best=Math.max(best,cur);} else cur=0; k = addDays(k,1); }
  return best;
}
function taskStreak(t){
  const dn = k => { const d = S.days[k]; if(!d) return false; return k === S.activeDay ? isDone(t,d) : !!d.done[t.id]; };
  let k = S.activeDay, c = 0; if(dn(k)) c++; k = addDays(k,-1); while(dn(k)){ c++; k = addDays(k,-1); } return c;
}
const totalXP = () => Object.keys(S.days).reduce((a,k) => a + ((stats(k)||{}).xp||0), 0);
function level(xp){ let L = 1, need = 100, acc = 0; while(xp >= acc + need){ acc += need; L++; need = 100 + (L-1)*50; } return {L, into: xp-acc, need}; }
const LEVEL_NAMES = ['البداية','الثبات','الاجتهاد','المثابرة','الإتقان','الرسوخ','الإحسان','القدوة'];
const lvlName = L => LEVEL_NAMES[Math.min(L-1, LEVEL_NAMES.length-1)];

function ring(pct, size=118, sw=10){
  const r = (size-sw)/2, c = 2*Math.PI*r, off = c*(1-pct/100);

}

        <option value="18.5" ${+st.angle===18.5?'selected':''}>أم القرى (١٨٫٥°)</option>
        <option value="19.5" ${+st.angle===19.5?'selected':''}>الهيئة المصرية (١٩٫٥°)</option>
        <option value="15" ${+st.angle===15?'selected':''}>أمريكا الشمالية (١٥°)</option>
      </select>
      <label class="f">تعديل بالدقائق (للمطابقة مع تقويمك المحلي)</label>
      <div class="row"><button class="wbtn" data-act="off" data-d="-1">−</button><div class="inp grow" style="text-align:center">${n(st.offset>0?'+'+st.offset:st.offset)} دقيقة</div><button class="wbtn" data-act="off" data-d="1">+</button></div>`
    : `<label class="f">وقت الفجر</label><input class="inp" type="time" data-set="manualFajr" value="${esc(st.manualFajr)}" style="direction:ltr">`}
    <div class="dim" style="font-size:12.5px;margin-top:12px">يبقى يومك مفتوحًا أثناء السهر حتى أذان الفجر التالي، ثم يُحفظ في الأرشيف ويبدأ يوم جديد.</div>
  </section>

  <div class="h-sec"><span>الأهداف</span></div>
  <section class="card">
    <label class="f" style="margin-top:0">نسبة اليوم الناجح (لعدّاد الأيام المتتالية): <b class="or">${n(st.threshold)}٪</b></label>
    <input type="range" min="30" max="100" step="5" value="${st.threshold}" data-set="threshold" style="width:100%;accent-color:#F2924A">
    <div class="row" style="gap:10px">
      <div class="grow"><label class="f">هدف الماء (مل)</label><input class="inp" type="number" inputmode="numeric" min="250" step="250" data-set="goalMl" value="${st.goalMl}" style="direction:ltr;text-align:center"></div>
      <div class="grow"><label class="f">حجم الكوب (مل)</label><input class="inp" type="number" inputmode="numeric" min="50" step="50" data-set="cupMl" value="${st.cupMl}" style="direction:ltr;text-align:center"></div>
    </div>
  </section>

  <div class="h-sec"><span>الأركان والمهام</span></div>
  <section class="card"><div class="chips">${PILLARS.map(p=>`<button class="chip" data-act="edit" data-k="${p.k}"><b class="or" style="direction:ltr">${p.k}</b> ${p.name}</button>`).join('')}</div></section>

  <div class="h-sec"><span>النسخ الاحتياطي</span></div>
  <section class="card">
    <div class="muted" style="font-size:13.5px;margin-bottom:12px">بياناتك محفوظة في هذا المتصفح. صدّر نسخة احتياطية دوريًا لتنقلها إلى جهاز آخر.</div>
    <div class="row"><button class="btn pri grow" data-act="export">تصدير نسخة (JSON)</button><button class="btn grow" data-act="import">استيراد البيانات</button></div>
  </section>

  <div class="h-sec"><span>أخرى</span></div>
  <section class="card">
    <div class="row"><button class="btn grow" data-act="splash">شاشة الترحيب</button><button class="btn danger grow" data-act="reset">مسح كل البيانات</button></div>
    <div class="dim" style="font-size:12px;text-align:center;margin-top:14px">طريق التطور والاتزان · D-K-P-L · الإصدار ١٫٠</div>
  </section>`;
}

function render(){
  if(view==='today') renderToday(); else if(view==='history') renderHistory(); else renderSettings();
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.nav===view));
}

/* ================= Sheets ================= */
function openSheet(html){ $('#sheetBody').innerHTML = html; $('#ov').classList.add('show'); $('#sheet').classList.add('show'); $('#sheet').scrollTop = 0; }
function closeSheet(){ $('#ov').classList.remove('show'); $('#sheet').classList.remove('show'); sheetMode = null; render(); }
let sheetMode = null;
function editSheet(k){
  sheetMode = {type:'edit', k};
  const p = PILLARS.find(x=>x.k===k), ts = S.tasks[k];
  openSheet(`<div class="row between"><h2>مهام ${p.name}</h2><button class="iconbtn" data-act="sheetclose" aria-label="إغلاق">${icons.x}</button></div>
    <div class="dim" style="font-size:13px">عدّل النص مباشرة، فعّل أو عطّل، أو احذف.</div>
    <div id="elist">${ts.map(t=>`<div class="erow"><input class="inp grow" data-etext="${t.id}" value="${esc(t.text)}" maxlength="100">
      <button class="sw ${t.on?'on':''}" data-act="eon" data-id="${t.id}" aria-label="تفعيل"></button>
      ${t.type==='water'?'<span style="width:32px"></span>':`<button class="del" data-act="edel" data-id="${t.id}" aria-label="حذف">${icons.x}</button>`}</div>`).join('')}</div>
    <form class="addrow mt" data-form="eadd"><input class="inp" name="t" placeholder="مهمة جديدة…" maxlength="100" autocomplete="off"><button class="btn pri" type="submit">إضافة</button></form>
    ${k==='P' ? `<label class="f">اختر مسارك لإضافة مهام مقترحة</label><div class="chips">${Object.keys(P_PATHS).map(x=>`<button class="chip" data-act="path" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div><div id="pathSug" class="mt"></div>` : ''}
    <button class="btn block mt2" data-act="sheetclose">تم</button>`);
}
function closeDaySheet(){
  sheetMode = {type:'close'};
  const d = today(), st = compute(d);
  const miss = PILLARS.flatMap(p => enabled(p.k).filter(t => !isDone(t,d) && t.type!=='water').map(t => ({t,p})));
  const thr = S.settings.threshold, ok = st.pct >= thr;
  const bonus = (ok?20:0) + (st.pct===100?30:0);
  openSheet(`<div class="row between"><h2>ختام اليوم</h2><button class="iconbtn" data-act="sheetclose" aria-label="إغلاق">${icons.x}</button></div>
    <div class="row mt" style="gap:16px"><div class="ringbox">${ring(st.pct)}<div class="val"><div><b>${n(st.pct)}٪</b><span>${n(st.done)} من ${n(st.total)}</span></div></div></div>
      <div class="grow" style="font-size:14.5px">${st.pct===100?'يومٌ مكتمل، بارك الله في سعيك.':ok?'يومٌ ناجح، والثبات يصنع الفرق.':`لم تبلغ ${n(thr)}٪ بعد. ما زال في الوقت متّسع.`}
      <div class="or mt" style="font-weight:700">مكافأة الختام: +${n(bonus)} XP</div></div></div>
    <div class="mt">${PILLARS.map(p=>{const [c,t]=st.per[p.k];return `<div style="margin:8px 0"><div class="row between" style="font-size:13.5px"><span>${p.name}</span><span>${n(c)}/${n(t)}</span></div><div class="bar" style="margin-top:4px"><i style="width:${t?c/t*100:0}%"></i></div></div>`}).join('')}</div>
    ${miss.length?`<div class="h-sec" style="margin-top:16px">لم تُنجز بعد — اضغط لإتمامها</div>${miss.map(({t})=>`<button class="task" data-act="toggle" data-id="${t.id}"><span class="ck">${icons.check}</span><span class="tx">${esc(t.text)}</span></button>`).join('')}`:''}
    <button class="btn pri block mt2" style="padding:16px" data-act="confirmclose">تثبيت اليوم وحفظ الإنجاز</button>
    <div class="dim" style="font-size:12px;text-align:center;margin-top:10px">يمكنك إعادة فتح اليوم قبل الفجر إن احتجت.</div>`);
}

/* ================= Actions ================= */
function findTask(id){ for(const p of PILLARS){ const t = S.tasks[p.k].find(x=>x.id===id); if(t) return t; } return null; }
let lastPct = null;
function afterChange(){
  save();
  const st = compute(today());
  if(lastPct !== null && st.pct === 100 && lastPct < 100){ toast('أتممت مهام يومك كاملة، بارك الله فيك'); vib([20,40,20]); }
  lastPct = st.pct;
}
document.addEventListener('click', e => {
  const nb = e.target.closest('[data-nav]');
  if(nb){ view = nb.dataset.nav; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, d = today();
  switch(a){
    case 'toggle': {
      if(d.closed) return;
      const id = b.dataset.id; if(d.done[id]) delete d.done[id]; else { d.done[id] = true; vib(12); }
      afterChange();
      if(sheetMode && sheetMode.type==='close'){ closeDaySheet(); render(); } else render();
      break; }
    case 'water': { if(d.closed) return; const g = cupsGoal(); const before = d.water||0; d.water = Math.max(0, Math.min(g*2, before + +b.dataset.d)); if(d.water>before) vib(10);
      if(before < g && d.water >= g) toast('أحسنت، بلغت هدف الماء'); afterChange(); render(); break; }
    case 'side': { const x = d.side.find(s=>s.id===b.dataset.id); if(x && !d.closed){ x.done = !x.done; if(x.done) vib(12); afterChange(); render(); } break; }
    case 'sidedel': { d.side = d.side.filter(s=>s.id!==b.dataset.id); afterChange(); render(); break; }
    case 'jump': { const el = $('#sec-'+b.dataset.k); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } break; }
    case 'edit': editSheet(b.dataset.k); break;
    case 'eon': { const t = findTask(b.dataset.id); if(t){ t.on = !t.on; b.classList.toggle('on', t.on); save(); } break; }
    case 'edel': { const k = sheetMode.k; const t = findTask(b.dataset.id); if(t && confirm(`حذف «${t.text}»؟`)){ S.tasks[k] = S.tasks[k].filter(x=>x.id!==t.id); save(); editSheet(k); } break; }
    case 'path': { const list = P_PATHS[b.dataset.v]||[]; $('#pathSug').innerHTML = list.map(s=>`<button class="task" data-act="addsug" data-v="${esc(s)}"><span class="ck" style="border-style:dashed">+</span><span class="tx">${esc(s)}</span></button>`).join(''); break; }
    case 'addsug': { const k = sheetMode.k; const v = b.dataset.v; if(S.tasks[k].some(t=>t.text===v)){ toast('موجودة مسبقًا'); break; } S.tasks[k].push({id:uid(),text:v,on:true}); save(); toast('أُضيفت المهمة'); editSheet(k); break; }
    case 'sheetclose': closeSheet(); break;
    case 'close': closeDaySheet(); break;
    case 'confirmclose': { d.closed = true; afterChange(); closeSheet(); toast('خُتم يومك، تقبّل الله منك'); vib([15,50,15]); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); break; }
    case 'reopen': { d.closed = false; afterChange(); render(); toast('أُعيد فتح اليوم'); break; }
    case 'fmode': { S.settings.fajrMode = b.dataset.v; rollover(); save(); render(); break; }
    case 'off': { S.settings.offset = Math.max(-60, Math.min(60, (+S.settings.offset||0) + +b.dataset.d)); rollover(); save(); render(); break; }
    case 'geo': {
      if(!navigator.geolocation){ toast('الموقع غير متاح في هذا المتصفح'); break; }
      toast('جارٍ تحديد الموقع…');
      navigator.geolocation.getCurrentPosition(p => { S.settings.lat = +p.coords.latitude.toFixed(4); S.settings.lng = +p.coords.longitude.toFixed(4); S.settings.place = 'موقعي الحالي'; rollover(); save(); render(); toast('حُدّث وقت الفجر حسب موقعك'); },
        () => toast('تعذّر تحديد الموقع'), {timeout:12000, maximumAge:6e5});
      break; }
    case 'export': exportData(); break;
    case 'import': $('#fileIn').click(); break;
    case 'reset': { if(confirm('سيُمسح كل السجل والإعدادات نهائيًا. هل أنت متأكد؟') && confirm('تأكيد أخير: مسح كل البيانات؟')){ localStorage.removeItem(KEY); S = defaults(); rollover(); saveNow(); render(); toast('بدأت صفحة جديدة'); } break; }
    case 'splash': showSplash(true); break;
  }
});
$('#ov').addEventListener('click', closeSheet);
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const v = (f.t.value||'').trim(); if(!v) return;
  if(f.dataset.form==='side'){ today().side.push({id:uid(), text:v, done:false}); afterChange(); render(); setTimeout(()=>{ const i = document.querySelector('[data-form=side] input'); i && i.focus(); },30); }
  if(f.dataset.form==='eadd'){ S.tasks[sheetMode.k].push({id:uid(), text:v, on:true}); save(); editSheet(sheetMode.k); setTimeout(()=>{ const i = document.querySelector('[data-form=eadd] input'); i && i.focus(); },30); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.etext){ const t = findTask(el.dataset.etext); if(t){ t.text = el.value.trim() || t.text; save(); } }
  if(el.dataset.set){
    const k = el.dataset.set; let v = el.value;
    if(['angle','threshold','goalMl','cupMl'].includes(k)) v = +v;
    if((k==='goalMl'||k==='cupMl') && (!v || v < 50)) return;
    S.settings[k] = v; save();
    if(k==='threshold'){ const lab = el.previousElementSibling.querySelector('b'); if(lab) lab.textContent = n(v)+'٪'; }
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.set;
  if(k && ['angle','manualFajr'].includes(k)){ rollover(); save(); render(); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetMode) closeSheet(); });

/* ================= Backup ================= */
async function exportData(){
  saveNow();
  const name = `dkpl-backup-${keyOf(new Date())}.json`;
  const blob = new Blob([JSON.stringify({app:'dkpl', exported:new Date().toISOString(), state:S}, null, 2)], {type:'application/json'});
  try{
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){ await navigator.share({files:[file], title:'نسخة احتياطية'}); return; }
  }catch(err){ if(err && err.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('صُدّرت النسخة الاحتياطية');
}
$('#fileIn').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result); const st = j.state || j;
      if(!st || !st.tasks || !st.days || !st.settings) throw new Error('bad');
      if(!confirm('سيستبدل الاستيراد بياناتك الحالية بهذه النسخة. متابعة؟')) return;
      S = migrate(st); rollover(); saveNow(); lastPct = compute(today()).pct; render(); toast('استُورِدت البيانات بنجاح');
    }catch(err){ toast('الملف غير صالح'); }
    e.target.value = '';
  };
  r.readAsText(file);
});

/* ================= Toast ================= */
let tT; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(()=>t.classList.remove('show'), 2400); }

/* ================= Splash ================= */
function showSplash(force){
  const sp = $('#splash'); sp.classList.remove('out','hide');
  const h = new Date().getHours();
  const msg = h>=3&&h<12 ? 'صباحٌ جديد وفرصةٌ متجدّدة. ابدأ بالله، وامضِ بثبات.' : h<17&&h>=12 ? 'ما زال في يومك متّسعٌ للخير. أكمل بثبات.' : 'أتمّ يومك بإحسان، واختمه بحمدٍ وسكينة.';
  $('#splashMsg').textContent = (S.settings.name ? `أهلًا ${S.settings.name}. ` : '') + msg;
  const ni = $('#splashName'); ni.classList.toggle('hide', !!S.settings.name);
  if(!$('#stars').childElementCount){ let s=''; for(let i=0;i<40;i++) s+=`<i style="top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${(Math.random()*4).toFixed(2)}s"></i>`; $('#stars').innerHTML = s; }
}
$('#splashGo').addEventListener('click', () => {
  const v = $('#splashName').value.trim(); if(v){ S.settings.name = v; save(); }
  const sp = $('#splash'); sp.classList.add('out'); setTimeout(()=>sp.classList.add('hide'), 700);
  render();
});

/* ================= Clock ================= */
function tick(force){
  const changed = rollover();
  if(changed){ lastPct = compute(today()).pct; if(view==='today' || force) render(); toast('بدأ يوم جديد مع الفجر، بارك الله لك فيه'); return; }
  if(view==='today' && !sheetMode){ const fl = document.querySelector('.fajrline'); if(fl){ const nf = nextFajrDate(); fl.innerHTML = `${icons.moon} يتجدّد يومك مع أذان الفجر ${fmtTime(nf.getHours()*60+nf.getMinutes())} · بعد ${untilFajr()}`; } }
}

/* ================= Boot ================= */
load();
rollover();
lastPct = compute(today()).pct;
render();
const first = !S.settings.name && !S.seenSplashName;
S.seenSplashName = true; save();
if(sessionStorage.getItem('dkpl.splash') && !first){ $('#splash').classList.add('hide'); }
else { sessionStorage.setItem('dkpl.splash','1'); showSplash(); }
setInterval(tick, 30000);

// Debug/test hook (harmless)
window.__dkpl = { get S(){return S;}, currentDayKey, fajrMin, rollover, render, streak, totalXP, level, compute, setState(s){ S = migrate(s); render(); } };

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
</body>
